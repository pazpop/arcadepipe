version: 2
updates:
  # Outils de lint (frontend) et de test (e2e).
  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"
  - package-ecosystem: "npm"
    directory: "/e2e"
    schedule:
      interval: "weekly"

  # Actions, épinglées par SHA : voir docs/deploiement.md.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
