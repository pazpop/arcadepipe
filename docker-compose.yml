# Déploiement autonome d'ArcadePipe, sans reverse-proxy externe : Caddy
# (frontend) route lui-même /api/* vers le backend (voir frontend/Caddyfile).
# Le déploiement de l'instance publique (Traefik devant) vit dans le repo
# terraform-infra-pazpop-hetzner.
#
# Usage :
#   docker compose up --build -d
#   -> le jeu est sur http://localhost (port 80)
#
# Port 80 déjà pris : modifier le mapping "80:80" ci-dessous (ex: "8080:80").
# Mesure d'audience : désactivée ; pour l'activer, voir docs/deploiement.md.
services:
  backend:
    build: ./backend
    volumes:
      - backend_data:/data
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 256m
    cpus: 0.5

  frontend:
    build: ./frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped
    read_only: true
    tmpfs:
      # /config,/data : XDG_CONFIG_HOME/XDG_DATA_HOME de Caddy (autosave de
      # config, cache) — pas de certificats : pas de TLS en autonome.
      # uid/gid : ceux de caddyuser (frontend/Dockerfile), sinon Caddy ne peut pas y écrire.
      - /tmp
      - /config:uid=1000,gid=1000
      - /data:uid=1000,gid=1000
    cap_drop:
      - ALL
    # NET_BIND_SERVICE : indispensable pour que le Caddy non-root (voir
    # frontend/Dockerfile, USER caddyuser) puisse quand même se lier au
    # port 80.
    cap_add:
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true
    mem_limit: 128m
    cpus: 0.25

volumes:
  backend_data:
