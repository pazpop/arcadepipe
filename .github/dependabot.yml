version: 2
updates:
  # PR à chaque nouvelle version (pip-audit, lui, ne signale qu'une CVE publiée).
  - package-ecosystem: "pip"
    directory: "/backend"
    schedule:
      interval: "weekly"

  # Actions (épinglées par SHA) et images de base (épinglées par digest) :
  # voir docs/deploiement.md.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"

  - package-ecosystem: "docker"
    directory: "/backend"
    schedule:
      interval: "weekly"
  - package-ecosystem: "docker"
    directory: "/frontend"
    schedule:
      interval: "weekly"
