name: Build & Deploy

# Lint et tests (e2e compris) aussi sur les PR (Dependabot compris) ; build et déploiement seulement sur main.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Deux pushs rapprochés : le second attend la fin du premier, pour que le
# dernier commit soit bien le dernier déployé.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_BACKEND: ${{ github.repository }}-backend
  IMAGE_FRONTEND: ${{ github.repository }}-frontend

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15 # un job bloqué ne retient pas la file des déploiements
    permissions:
      contents: read
    steps:
      # Actions épinglées par SHA (voir docs/deploiement.md).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.13"
      - name: ruff check (backend)
        run: |
          pip install -r backend/requirements-dev.txt
          ruff check backend
      # Code resté après une suppression : exports, textes, ids et styles inutilisés.
      - name: code fantôme (frontend)
        run: python tools/check_unused.py
      # pip-audit : une CVE connue dans les dépendances Python bloque le build.
      - name: pip-audit (backend)
        run: |
          pip-audit -r backend/requirements.txt
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - name: eslint (frontend)
        working-directory: frontend
        run: |
          npm ci
          npm run lint

  # Tests de logique pure (quelques secondes) : backend (pytest) et frontend (node --test).
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15 # un job bloqué ne retient pas la file des déploiements
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.13"
      - name: pytest (backend)
        working-directory: backend
        run: |
          pip install -r requirements-dev.txt
          pytest
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - name: node --test (frontend)
        working-directory: frontend/js
        run: node --test

  # Tests bout-en-bout (Playwright, quelques minutes) : le jeu piloté dans un
  # vrai navigateur, avec le backend lancé à côté pour les tests du classement
  # (voir e2e/README.md).
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15 # un job bloqué ne retient pas la file des déploiements
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.13"
      # backend/venv : là où e2e/playwright.config.js cherche le backend.
      - name: Environnement du backend
        working-directory: backend
        run: |
          python -m venv venv
          venv/bin/pip install -r requirements.txt
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - name: Playwright
        working-directory: e2e
        run: |
          npm ci
          npx playwright install --with-deps chromium
          npx playwright test

  build-and-push:
    if: github.event_name == 'push'
    needs: [lint, tests, e2e]
    runs-on: ubuntu-latest
    timeout-minutes: 15 # un job bloqué ne retient pas la file des déploiements
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0 # tout l'historique : le numéro de version est le nombre de commits

      # Numéro de version du jeu : 2.<nombre de commits>, écrit dans l'image du frontend.
      - name: Numéro de version
        id: version
        run: echo "version=2.$(git rev-list --count HEAD)" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push backend
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: ./backend
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_BACKEND }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_BACKEND }}:${{ github.sha }}

      - name: Build & push frontend
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: ./frontend
          push: true
          # GA_MEASUREMENT_ID : variable du dépôt (Settings > Secrets and
          # variables > Actions > Variables). Absente, sur un fork par exemple :
          # pas de mesure d'audience.
          build-args: |
            GA_MEASUREMENT_ID=${{ vars.GA_MEASUREMENT_ID }}
            APP_VERSION=${{ steps.version.outputs.version }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_FRONTEND }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_FRONTEND }}:${{ github.sha }}

      # Le déploiement vit dans terraform-infra-pazpop-hetzner, notifié ici.
      # Sautée sur un fork (secret absent).
      - name: Notifier terraform-infra-pazpop-hetzner
        if: ${{ github.repository == 'pazpop/arcadepipe' }}
        uses: peter-evans/repository-dispatch@28959ce8df70de7be546dd1250a005dd32156697 # v4
        with:
          token: ${{ secrets.TERRAFORM_INFRA_DISPATCH_TOKEN }}
          repository: pazpop/terraform-infra-pazpop-hetzner
          event-type: arcadepipe-published
