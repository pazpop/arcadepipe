<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>ArcadePipe — Starfighter</title>
<meta name="description" content="ArcadePipe Starfighter — jeu d'arcade spatial rétro gratuit, jouable directement dans le navigateur, sans installation. Vagues d'ennemis, boss, bonus et classement en ligne." />
<meta name="robots" content="index, follow" />
<link rel="canonical" href="https://arcadepipe.pazpop.net/" />
<!-- Dessiné d'après le sprite du vaisseau (PLAYER_ROWS, js/assets.js). -->
<link rel="icon" type="image/svg+xml" href="favicon.svg" />
<meta property="og:type" content="website" />
<meta property="og:title" content="ArcadePipe — Starfighter" />
<meta property="og:description" content="Jeu d'arcade spatial rétro gratuit, jouable directement dans le navigateur." />
<meta property="og:url" content="https://arcadepipe.pazpop.net/" />
<meta name="twitter:card" content="summary" />
<meta name="twitter:title" content="ArcadePipe — Starfighter" />
<meta name="twitter:description" content="Jeu d'arcade spatial rétro gratuit, jouable directement dans le navigateur." />
<link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div id="game-container">
    <canvas id="game-canvas"></canvas>
    <div id="crt-overlay" aria-hidden="true"></div>
    <!-- tabindex="-1" : jamais atteint par Tab, seul le jeu lui donne le focus. -->
    <input id="name-input" type="text" maxlength="8" autocomplete="off" autocapitalize="characters" tabindex="-1" />

    <div id="mc-wrap">
      <div id="music-controls">
        <div class="mc-section">
          <button id="pause-btn" type="button" class="mc-pause-btn" data-i18n="panel.pause" data-i18n-title="panel.pause.title"></button>
        </div>
        <div class="mc-section">
          <div class="mc-label" data-i18n="panel.music"></div>
          <div class="mc-row">
            <button id="music-stop-btn" type="button" data-i18n-title="panel.music.stop">⏹</button>
            <button id="music-next-btn" type="button" data-i18n-title="panel.music.next">⏭</button>
            <input id="music-volume" type="range" min="0" max="100" step="1" data-i18n-title="panel.music.volume" />
          </div>
        </div>
        <div class="mc-section">
          <div class="mc-label" data-i18n="panel.sfx"></div>
          <div class="mc-row">
            <input id="sfx-volume" type="range" min="0" max="100" step="1" data-i18n-title="panel.sfx.volume" />
          </div>
        </div>
        <div class="mc-section">
          <div class="mc-label" data-i18n="panel.speed"></div>
          <button id="speed-btn" type="button" class="mc-pause-btn" data-i18n-title="panel.speed.title">x1</button>
        </div>
        <div class="mc-section">
          <label class="mc-check">
            <input id="autofire-toggle" type="checkbox" />
            <span data-i18n="panel.autofire"></span>
          </label>
        </div>
        <div class="mc-section">
          <button id="help-btn" type="button" class="mc-pause-btn" data-i18n="panel.help"></button>
        </div>
        <div class="mc-section">
          <button id="fullscreen-btn" type="button" class="mc-pause-btn" data-i18n="panel.fullscreen"></button>
        </div>
        <!-- Même rangée : une section de plus et le panneau ne tient plus sous le
             bandeau de consentement sur un téléphone en paysage. Le bouton de
             langue affiche la langue courante ; un clic passe à la suivante
             (voir js/i18n.js). -->
        <div class="mc-section mc-row">
          <button id="cookie-btn" type="button" class="mc-pause-btn" data-i18n="panel.cookies" data-i18n-title="panel.cookies.title"></button>
          <button id="lang-btn" type="button" class="mc-pause-btn" data-i18n="lang.name" data-i18n-title="panel.lang.title"></button>
        </div>
        <div class="mc-section mc-version" id="version-label"></div>
      </div>
      <!-- Hors du panneau qui glisse : reste toujours visible, replié ou non. -->
      <button id="mc-toggle" type="button" data-i18n-title="panel.toggle.title">◀</button>
    </div>

    <!-- NOVA au tactile (Espace au clavier), masqué tant qu'aucune charge n'est prête (main.js). -->
    <button id="nova-btn" type="button" class="nova-btn hidden" data-i18n-title="nova.title">✦ NOVA</button>

    <!-- Image du résultat à partager (shareCard.js), visible en fin de partie (main.js). -->
    <button id="share-btn" type="button" class="share-btn hidden" data-i18n="share.button" data-i18n-title="share.title"></button>

    <!-- Consentement RGPD : Google Analytics n'est chargé qu'après "Accepter"
         (js/consent.js). Affiché tant qu'aucun choix n'est mémorisé, ou rouvert
         par le bouton Cookies. Les textes viennent de js/i18n/ (data-i18n). -->
    <div id="cookie-banner" class="cookie-banner hidden" role="dialog" data-i18n-aria="cookie.aria">
      <span><span data-i18n="cookie.text"></span> <a data-i18n="cookie.more" href="https://github.com/pazpop/arcadepipe/blob/main/docs/donnees-collectees.md" target="_blank" rel="noopener"></a></span>
      <div class="cookie-actions">
        <button id="cookie-accept" type="button" data-i18n="cookie.accept"></button>
        <button id="cookie-decline" type="button" data-i18n="cookie.decline"></button>
      </div>
    </div>
  </div>

  <script type="module" src="js/main.js"></script>
</body>
</html>
