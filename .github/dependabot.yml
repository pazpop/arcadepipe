version: 2
updates:
  # PR à chaque nouvelle version (pip-audit, lui, ne signale qu'une CVE publiée).
  # Une seule PR pour toutes les dépendances Python : elles sont toutes épinglées
  # (backend/requirements.txt), et certaines ne s'installent qu'ensemble
  # (fastapi et starlette).
  - package-ecosystem: "pip"
    directory: "/backend"
    schedule:
      interval: "weekly"
    groups:
      python:
        patterns: ["*"]

  # Outils de lint (frontend) et de test (e2e).
  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"
  - package-ecosystem: "npm"
    directory: "/e2e"
    schedule:
      interval: "weekly"

  # Actions (épinglées par SHA) et images de base (épinglées par digest) :
  # voir docs/deploiement.md.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"

  - package-ecosystem: "docker"
    directory: "/backend"
    schedule:
      interval: "weekly"
  - package-ecosystem: "docker"
    directory: "/frontend"
    schedule:
      interval: "weekly"
