name: Build & Deploy

# Lint et tests aussi sur les PR (Dependabot compris) ; build et déploiement seulement sur main.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE_BACKEND: ${{ github.repository }}-backend
  IMAGE_FRONTEND: ${{ github.repository }}-frontend

jobs:
  lint:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # Actions épinglées par SHA (voir docs/deploiement.md).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.13"
      - name: ruff check (backend)
        run: |
          pip install ruff
          ruff check backend
      # pip-audit : une CVE connue dans les dépendances Python bloque le build.
      - name: pip-audit (backend)
        run: |
          pip install pip-audit
          pip-audit -r backend/requirements.txt
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
      - name: eslint (frontend)
        working-directory: frontend
        run: |
          npm ci
          npm run lint

  # Tests de logique pure (quelques secondes) : backend (pytest) et frontend
  # (node --test). Les tests e2e (Playwright, ~2 min) restent lancés à la main.
  tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.13"
      - name: pytest (backend)
        working-directory: backend
        run: |
          pip install -r requirements.txt -r requirements-dev.txt
          pytest
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
      - name: node --test (frontend)
        working-directory: frontend/js
        run: node --test

  build-and-push:
    if: github.event_name == 'push'
    needs: [lint, tests]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push backend
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: ./backend
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_BACKEND }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_BACKEND }}:${{ github.sha }}

      - name: Build & push frontend
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: ./frontend
          push: true
          # Variable du dépôt (Settings > Secrets and variables > Actions >
          # Variables). Absente, sur un fork par exemple : pas de mesure d'audience.
          build-args: |
            GA_MEASUREMENT_ID=${{ vars.GA_MEASUREMENT_ID }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_FRONTEND }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_FRONTEND }}:${{ github.sha }}

      # Le déploiement vit dans terraform-infra-pazpop-hetzner, notifié ici.
      # Sautée sur un fork (secret absent).
      - name: Notifier terraform-infra-pazpop-hetzner
        if: ${{ github.repository == 'pazpop/arcadepipe' }}
        uses: peter-evans/repository-dispatch@28959ce8df70de7be546dd1250a005dd32156697 # v4
        with:
          token: ${{ secrets.TERRAFORM_INFRA_DISPATCH_TOKEN }}
          repository: pazpop/terraform-infra-pazpop-hetzner
          event-type: arcadepipe-published
