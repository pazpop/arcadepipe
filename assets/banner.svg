<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 160" width="640" height="160" role="img" aria-label="ArcadePipe">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#161b22"/>
    </linearGradient>
  </defs>

  <rect width="640" height="160" rx="14" fill="url(#bg)"/>
  <rect x="1" y="1" width="638" height="158" rx="13" fill="none" stroke="#30363d" stroke-width="1"/>

  <!-- Petit vaisseau pixel-art, dans l'esprit du sprite du joueur en jeu -->
  <g transform="translate(30,32)">
    <rect x="14" y="0" width="4" height="4" fill="#58a6ff"/>
    <rect x="10" y="4" width="12" height="4" fill="#58a6ff"/>
    <rect x="6" y="8" width="20" height="4" fill="#79c0ff"/>
    <rect x="2" y="12" width="28" height="6" fill="#79c0ff"/>
    <rect x="8" y="18" width="4" height="4" fill="#e3b341"/>
    <rect x="20" y="18" width="4" height="4" fill="#e3b341"/>
  </g>

  <text x="140" y="72" font-family="Consolas, 'Courier New', monospace" font-size="34" font-weight="700" fill="#e6edf3">ArcadePipe</text>
  <text x="140" y="98" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#8b949e">Shoot'em up dans le navigateur, pixel art généré par code</text>

  <g font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#6e7681">
    <text x="140" y="126">🎮 jouable direct</text>
    <text x="280" y="126">🏆 leaderboard</text>
    <text x="410" y="126">🐳 docker compose up</text>
  </g>
</svg>
