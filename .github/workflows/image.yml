name: Tests & image

# Lint, tests (e2e compris) et construction des images sur les push et les PR (Dependabot compris) ;
# images poussées sur GHCR seulement sur un push sur main. Le déploiement se fait à part,
# à la main, depuis le dépôt d'infra.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Deux pushs rapprochés : le second attend la fin du premier, pour que l'image
# :latest soit bien celle du dernier commit.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_BACKEND: ${{ github.repository }}-backend
  IMAGE_FRONTEND: ${{ github.repository }}-frontend

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15 # un job bloqué ne retient pas la file des runs
    permissions:
      contents: read
    steps:
      # Actions épinglées par SHA (voir docs/deploiement.md).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false # aucun job ne pousse : le jeton ne reste pas dans .git/config
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.13"
      - name: ruff check (backend)
        run: |
          pip install -r backend/requirements-dev.txt
          ruff check backend
      # Code resté après une suppression : exports, textes, ids et styles inutilisés.
      - name: code fantôme (frontend)
        run: python tools/check_unused.py
      # pip-audit : une CVE connue dans les dépendances Python bloque le build.
      - name: pip-audit (backend)
        run: |
          pip-audit -r backend/requirements.txt
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - name: eslint (frontend)
        working-directory: frontend
        run: |
          npm ci
          npm run lint

  # Tests de logique pure (quelques secondes) : backend (pytest) et frontend (node --test).
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15 # un job bloqué ne retient pas la file des runs
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false # aucun job ne pousse : le jeton ne reste pas dans .git/config
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.13"
      - name: pytest (backend)
        working-directory: backend
        run: |
          pip install -r requirements-dev.txt
          pytest
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - name: node --test (frontend)
        working-directory: frontend/js
        run: node --test

  # Tests bout-en-bout (Playwright, quelques minutes) : le jeu piloté dans un
  # vrai navigateur, avec le backend lancé à côté pour les tests du classement
  # (voir e2e/README.md).
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15 # un job bloqué ne retient pas la file des runs
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false # aucun job ne pousse : le jeton ne reste pas dans .git/config
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.13"
      # backend/venv : là où e2e/playwright.config.js cherche le backend.
      - name: Environnement du backend
        working-directory: backend
        run: |
          python -m venv venv
          venv/bin/pip install -r requirements.txt
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - name: Playwright
        working-directory: e2e
        run: |
          npm ci
          npx playwright install --with-deps chromium
          npx playwright test

  # Sur une PR aussi (Dependabot compris) : les images sont construites sans être poussées. Une PR qui casse leur
  # construction (une image de base trop neuve…) se voit avant d'être fusionnée.
  build-and-push:
    needs: [lint, tests, e2e]
    runs-on: ubuntu-latest
    timeout-minutes: 15 # un job bloqué ne retient pas la file des runs
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0 # tout l'historique : le numéro de version est le nombre de commits

      # Numéro de version du jeu : 3.<nombre de commits>, écrit dans l'image du frontend.
      # 3 : l'historique Git est reparti de zéro après 2.201 (la série 2 comptait les commits de l'ancien).
      - name: Numéro de version
        id: version
        run: echo "version=3.$(git rev-list --count HEAD)" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push backend
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: ./backend
          push: ${{ github.event_name == 'push' }}
          provenance: false
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_BACKEND }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_BACKEND }}:${{ github.sha }}

      - name: Build & push frontend
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: ./frontend
          push: ${{ github.event_name == 'push' }}
          provenance: false
          build-args: |
            APP_VERSION=${{ steps.version.outputs.version }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_FRONTEND }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_FRONTEND }}:${{ github.sha }}

      # Ménage sur GHCR : seules les 5 dernières versions de chaque image restent. Il faut une version par push :
      # provenance: false (plus haut), ni sbom, ni multi-arch. Sinon, des manifestes sans étiquette apparaissent, et le
      # ménage les effacerait sous une image gardée.
      - name: Garder les 5 dernières images (backend)
        if: github.event_name == 'push'
        uses: actions/delete-package-versions@e5bc658cc4c965c472efe991f8beea3981499c55 # v5.0.0
        with:
          package-name: ${{ github.event.repository.name }}-backend
          package-type: container
          min-versions-to-keep: 5

      - name: Garder les 5 dernières images (frontend)
        if: github.event_name == 'push'
        uses: actions/delete-package-versions@e5bc658cc4c965c472efe991f8beea3981499c55 # v5.0.0
        with:
          package-name: ${{ github.event.repository.name }}-frontend
          package-type: container
          min-versions-to-keep: 5
