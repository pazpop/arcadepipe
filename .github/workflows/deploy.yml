name: Build & Deploy

on:
  push:
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE_BACKEND: ${{ github.repository }}-backend
  IMAGE_FRONTEND: ${{ github.repository }}-frontend

jobs:
  lint:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # Épinglé par SHA (pas par tag) : un tag comme "v7" peut être redéplacé
      # vers un autre commit (compromission du mainteneur, prise de contrôle
      # du repo...) sans qu'aucun changement n'apparaisse ici — le SHA, lui,
      # est immuable. Dependabot (.github/dependabot.yml) ouvre une PR de
      # bump à chaque nouvelle version, donc rien à surveiller à la main.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.11"
      - name: ruff check (backend)
        run: |
          pip install ruff
          ruff check backend
      # pip-audit : vérifie les CVE connues des dépendances Python
      # installées (base pypi.org/PyPI Advisory Database), pas les mêmes
      # versions figées indéfiniment que ruff (qui ne vérifie que le style).
      # exit-code non nul si une CVE est trouvée -> bloque le build, pas
      # juste un avertissement silencieux dans les logs.
      - name: pip-audit (backend)
        run: |
          pip install pip-audit
          pip-audit -r backend/requirements.txt

  build-and-push:
    needs: lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push backend
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: ./backend
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_BACKEND }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_BACKEND }}:${{ github.sha }}

      - name: Build & push frontend
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: ./frontend
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_FRONTEND }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_FRONTEND }}:${{ github.sha }}

      # Ce repo ne connaît jamais l'IP du VPS ni les détails Traefik — le
      # déploiement réel (docker-compose.yml avec labels Traefik, SSH) vit
      # dans github.com/pazpop/terraform-infra-pazpop-hetzner, notifié ici
      # une fois les images publiées. La condition `if` évite que cette
      # étape s'exécute (et échoue faute de secret) sur un fork/usage
      # communautaire — le build+push ci-dessus reste utile en soi.
      - name: Notifier terraform-infra-pazpop-hetzner
        if: ${{ github.repository == 'pazpop/arcadepipe' }}
        uses: peter-evans/repository-dispatch@28959ce8df70de7be546dd1250a005dd32156697 # v4
        with:
          token: ${{ secrets.TERRAFORM_INFRA_DISPATCH_TOKEN }}
          repository: pazpop/terraform-infra-pazpop-hetzner
          event-type: arcadepipe-published
